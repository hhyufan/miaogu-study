<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵咕学习平台 - 管理后台</title>
    <script>
        // 检查是否已登录
        const adminToken = localStorage.getItem('adminToken');
        if (adminToken) {
            // 已登录，跳转到仪表盘
            window.location.href = 'dashboard.html';
        } else {
            // 未登录，跳转到登录页面
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="text-align: center;">
            <h2>正在跳转到管理后台...</h2>
            <p>如果页面没有自动跳转，请点击 <a href="login.html">这里</a></p>
        </div>
    </div>
</body>
</html>
