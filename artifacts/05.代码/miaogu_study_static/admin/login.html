<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 喵咕学习平台</title>
    <link rel="stylesheet" href="css/admin-styles.css">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <svg class="logo-icon" width="32" height="32" viewBox="0 0 16 16" fill="currentColor">
                    <path
                        d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z" />
                </svg>
                <h1>管理员登录</h1>
                <p>喵咕学习平台后台管理系统</p>
            </div>

            <form class="login-form" id="adminLoginForm">
                <div class="form-group">
                    <label for="username">用户名或邮箱</label>
                    <input type="text" id="username" name="username" required placeholder="请输入管理员用户名或邮箱"
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required placeholder="请输入密码"
                        autocomplete="current-password">
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkmark"></span>
                        记住我
                    </label>
                    <a href="#" class="forgot-password">忘记密码？</a>
                </div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">登录</span>
                    <div class="loading-spinner" style="display: none;">
                        <div class="spinner"></div>
                    </div>
                </button>

                <div class="error-message" id="errorMessage" style="display: none;"></div>
            </form>

            <div class="login-footer">
                <p>© 2024 喵咕学习平台. 保留所有权利.</p>
                <div class="footer-links">
                    <a href="../index.html">返回首页</a>
                    <a href="#" onclick="toggleTheme()">切换主题</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/admin-login.js"></script>
</body>

</html>
